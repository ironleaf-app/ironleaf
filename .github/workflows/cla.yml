# CLA check (CLA Assistant Lite, contributor-assistant/github-action; no third-party service).
#
# On a pull request it looks at every commit author. Anyone who has not signed CLA.md gets a comment asking them to
# reply with exactly:
#     I have read the CLA Document and I hereby sign the CLA
# The signature (GitHub login, id, PR number, date) is committed by the action to
# signatures/version1/cla.json on the `cla-signatures` branch (created and seeded by tools/github-setup.sh; that
# branch must NOT be protected). Until everyone has signed, the job named `cla` fails, and branch protection on main
# requires it. Commenting `recheck` runs it again. After a merge the PR conversation is locked so signature comments
# cannot be edited or deleted later.
#
# Safety: this runs on `pull_request_target` (base repository context, write token) so it can comment on PRs from
# forks. It therefore NEVER checks out or runs code from the pull request: there is no checkout step, the action only
# reads PR metadata through the API. Do not add a checkout or any `run:` step that uses PR content here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

# Nothing at the workflow level; the job asks only for what the action uses.
permissions: {}

concurrency:
  # One run at a time per pull request, so two signature commits never race. Not cancelled: a sign comment must count.
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: cla
    # Comments: only on pull requests, and only the sign phrase or `recheck`. PR events: always.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write        # re-run the failed CLA check on the PR after someone signs
      contents: write       # commit signatures to the cla-signatures branch
      pull-requests: write  # comment on the PR, lock it after merge
      statuses: write       # report the CLA status
    steps:
      - name: CLA Assistant Lite
        # v2.6.1. The action itself declares the node20 runtime; GitHub runs it on its current Node.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # Bots and the maintainers never sign. `*[bot]` matches any GitHub App bot login (dependabot[bot], ...).
          # The maintainers' logins come from the repository secret MAINTAINER_LOGINS (comma-separated; set by
          # tools/github-setup.sh), never from this file. A secret, not a variable: a public run log prints a
          # step's inputs, and only secrets are masked there.
          allowlist: dependabot[bot],github-actions[bot],*[bot],${{ secrets.MAINTAINER_LOGINS }}
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be reviewed and merged, every author of its commits needs
            to sign the Ironleaf [Contributor Licence Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            once. You keep the copyright in your work. To sign, read the CLA and reply to this pull request with the
            exact sentence below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All authors of this pull request have signed the CLA. Thank you.
          create-file-commit-message: 'CLA: create the signatures file'
          signed-commit-message: 'CLA: $contributorName signed in $owner/$repo'
          lock-pullrequest-aftermerge: true
