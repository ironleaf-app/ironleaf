# Release sketch: DISABLED. It only runs by hand (workflow_dispatch) and every job is guarded by `if: false` until
# a maintainer sets it up: the signing secret below, code-signing for Windows, and where the files are published.
# Today releases are made with `node tools/release.mjs` on a build machine (docs/RELEASING.md).
#
# When enabling it:
# - Put IRONLEAF_UPDATE_SIGNING_KEY in the `release` environment (Settings > Environments), not in repository
#   secrets. tools/github-setup.sh creates that environment: owner approval required, main only. Fork pull requests
#   never see environment or repository secrets, and this workflow has no pull request trigger.
# - It only builds and uploads the files as a workflow artifact; it does not publish, so the token is read-only.
name: Release (disabled)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: false && github.ref == 'refs/heads/main' # remove `false &&` when the secret and the publish target exist
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in the release job: a release is built from a clean install.
      - run: npm ci
      - name: Build tools outside the repo (electron-builder, pinned)
        run: |
          mkdir -p ~/.ironleaf-buildtools && cd ~/.ironleaf-buildtools && npm init -y
          npm i --save-exact electron-builder@26.18.0 resedit@3.1.1 @electron/fuses@2.1.3
      - name: Release (signs latest.json; never publishes from here)
        env:
          # The notes go through the environment, never pasted into the script, so quotes in them cannot run code.
          NOTES: ${{ github.event.inputs.notes }}
          NV_UPDATE_SIGNING_KEY: ${{ secrets.IRONLEAF_UPDATE_SIGNING_KEY }}
        run: xvfb-run -a node tools/release.mjs --notes "$NOTES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ironleaf-release
          path: dist/release/
          if-no-files-found: error
