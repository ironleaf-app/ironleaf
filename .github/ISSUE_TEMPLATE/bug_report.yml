name: Bug report
description: Something in Ironleaf does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems: do not file them here.** Report them privately (see SECURITY.md).

        Everything in an issue is public. Never paste real notes, names, email addresses, file paths with your name
        in them, API keys or tokens. Use a small made-up vault to show the problem.
  - type: input
    id: version
    attributes: { label: Ironleaf version, description: Settings › About }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: Operating system, options: [Windows 11, Windows 10, Linux (AppImage), Linux (from source), Other] }
    validations: { required: true }
  - type: input
    id: os-detail
    attributes: { label: OS version or distribution, description: "For example Windows 11 24H2, Ubuntu 24.04. Optional." }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you expected, and what happened instead." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Numbered steps from opening Ironleaf, ideally with a small made-up vault."
      placeholder: |
        1. Open a new vault
        2. ...
        3. See the error
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Anything from the error log. Before pasting, remove note titles and contents, your user name in file paths,
        email addresses, keys and tokens.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed personal data (notes, names, paths, keys, tokens) from everything above.
          required: true
